project_id = "sistem-pwa-kay"

[auth]
enabled = true
site_url = "https://kaykaopolimentos.com.br/"
additional_redirect_urls = [
  "https://kaykaopolimentos.com.br/**",
  "https://sistem-pwa-kay.vercel.app/**",
  "https://sistem-pwa-kay-wb5001625-5792s-projects.vercel.app/**",
  "https://sistem-pwa-kay-git-master-wb5001625-5792s-projects.vercel.app/**",
  "https://sistem-pwa-*-wb5001625-5792s-projects.vercel.app/**",
  "http://localhost:*/**",
  "http://127.0.0.1:*/**"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600
